name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -I https://charlottesville-housing-crisis-analysis-9phzppxalqmab73exwocki.streamlit.app
          echo "App pinged successfully at $(date)"
